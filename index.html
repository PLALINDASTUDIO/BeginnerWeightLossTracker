#modal .confirm-art{width:56px;height:56px;background:var(--soft);border-radius:17px;display:grid;place-items:center;color:var(--primary);font-size:29px;margin-bottom:12px}
#modal .confirm-copy{color:var(--muted);line-height:1.8;font-size:14px;margin-bottom:20px}
#modal .confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modal .confirm-actions .btn{min-height:47px}
#modal .confirm-actions .confirm-danger{background:#bb3544;border-color:#bb3544;color:white}
body.dark .hero{background:linear-gradient(125deg,#422632 0%,#622e3f 52%,#7d4051 100%)!important}

body.dark .hero .hero-cta{background:#352534;color:#ffe5e4;border:1px solid #a75c70;box-shadow:none}
body.dark .hero .hero-side{background:#ffffff10!important;border-color:#ffffff33!important}
body.dark .hero .hero-tagline{color:#fff5f5}
body.dark .hero .hero-motivation{color:#f7d8dd}

body.dark .meter-ring>span{background:var(--surface)}
body.dark .chart .bar{background:linear-gradient(180deg,#f3a0a9,#a34a61)}

body.dark .progress>i{background:linear-gradient(90deg,#bd5c71,#efa1ae)}
body.dark .topsearch,body.dark .iconbutton{background:#282f3d;color:#f6e7ea;border-color:#47505f}

body.dark .activation-strip{background:#3b2938;border-color:#5d4050}

<style id="plalinda-final-polish-v5">
/* V5: five surgical refinements; original record storage and actions remain unchanged. */
#dashboard .hero{min-height:392px;align-items:stretch}
#dashboard .hero>.hero-journey-layout{align-items:stretch;gap:0}
#dashboard .hero .hero-motivation{margin-bottom:14px}
#dashboard .journey-summary{width:100%;max-width:570px;margin:3px 0 18px;padding:15px 16px 12px;border:1px solid rgba(255,255,255,.28);border-radius:17px;background:rgba(255,255,255,.095);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
#dashboard .journey-summary-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#fff2ef;font-weight:800;margin-bottom:11px}
#dashboard .journey-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#dashboard .journey-stat{border-right:1px solid rgba(255,255,255,.2);min-width:0;padding-right:8px}
#dashboard .journey-stat:last-child{border:0;padding-right:0}
#dashboard .journey-stat small{display:block;color:#ffe5e0;font-size:10px;font-weight:650;line-height:1.35;margin-bottom:5px}
#dashboard .journey-stat strong{color:#fff;font-size:clamp(16px,1.7vw,22px);letter-spacing:-.6px;font-variant-numeric:tabular-nums;white-space:nowrap}
#dashboard .journey-stat strong span{font-size:10px;font-weight:600;letter-spacing:0}
#dashboard .journey-progress{height:6px;border-radius:30px;background:rgba(255,255,255,.26);overflow:hidden;margin-top:12px}
#dashboard .journey-progress>i{display:block;height:100%;border-radius:30px;background:#fff;transition:width .3s ease}
#dashboard .journey-caption{font-size:10px;color:#fff0ed;margin-top:6px}
#dashboard .hero .hero-cta{margin-top:auto;align-self:flex-start;min-height:46px}
#dashboard .hero-side.weight-interactive{cursor:pointer;user-select:none;transition:transform .22s ease,background .22s ease,border-color .22s ease,box-shadow .22s ease;position:relative;overflow:hidden;transform:translateZ(0)}
@media(hover:hover){#dashboard .hero-side.weight-interactive:hover{transform:translateY(-4px) scale(1.012);background:rgba(255,255,255,.21);box-shadow:0 14px 34px rgba(45,7,17,.17);border-color:rgba(255,255,255,.65)}}
#dashboard .hero-side.weight-interactive:active,#dashboard .hero-side.weight-interactive.weight-touch{transform:scale(.975);background:rgba(255,255,255,.26);box-shadow:0 0 0 4px rgba(255,255,255,.17)}
#dashboard .hero-side.weight-interactive:focus-visible{outline:3px solid #fff;outline-offset:3px}
#dashboard .hero-side.weight-interactive .weight-action-hint{display:block;color:#ffe8e1;font-size:10px;font-weight:700;margin-top:9px;letter-spacing:.1px}
/* Hydration: percentage and its caption form a single vertically centered unit. */
#dashboard .hydration-card .meter-ring>span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.05;font-size:inherit}
#dashboard .hydration-card .meter-ring .water-percent{font-size:25px;letter-spacing:-.65px;color:var(--ink);font-weight:850;font-variant-numeric:tabular-nums}
#dashboard .hydration-card .meter-ring .water-subtitle{display:block;color:var(--muted);font-size:10px;font-weight:650;margin:0;line-height:1.3}
/* Restore readable compact summary cards, without changing sizes or data. */
#section .grid.cols3>.card.summary-balance{display:flex;flex-direction:column;justify-content:space-between;min-height:205px;gap:12px;position:relative;overflow:hidden}
#section .grid.cols3>.card.summary-balance::before{content:"";height:4px;background:linear-gradient(90deg,var(--primary),transparent);position:absolute;left:21px;right:21px;bottom:0;opacity:.45;border-radius:5px}
#section .grid.cols3>.card.summary-balance .card-heading{flex:0 0 auto}
#section .grid.cols3>.card.summary-balance .metric-num{margin:0;align-self:flex-start;font-size:clamp(40px,3.3vw,54px);line-height:1.08;letter-spacing:-1.7px;min-width:0;font-variant-numeric:tabular-nums}
#section .grid.cols3>.card.summary-recent .metric-num{font-size:clamp(25px,2.4vw,36px);letter-spacing:-.9px;overflow-wrap:anywhere}
#section .grid.cols3>.card.summary-balance>.micro{display:block;margin:0;padding-bottom:10px;font-size:12px;line-height:1.5}
/* Guide search should not reveal details before the user selects the topic. */
#settingsPage #guideList .guideitem[hidden]{display:none!important}
#settingsPage #guideList .guideitem{scroll-margin-top:125px}
#settingsPage #guideList .guideitem summary .guide-summary-main{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
#settingsPage #guideList .guideitem summary .guide-match-excerpt{color:var(--muted);font-size:11px;font-weight:500;line-height:1.45}
#settingsPage .guide-find-status{font-size:12px;color:var(--muted);margin-top:9px;min-height:20px}
#settingsPage .guideitem summary mark{background:#ffe3a3!important;color:#5e2830!important}
body.dark #settingsPage .guideitem summary mark{background:#ffcf79!important;color:#342329!important}
@media(max-width:900px){#dashboard .hero{min-height:auto}#dashboard .hero .hero-cta{margin-top:10px}#dashboard .journey-summary{max-width:none}}
@media(max-width:520px){#dashboard .hero .journey-summary{padding:13px 12px;margin-top:5px}#dashboard .journey-stats{gap:7px}#dashboard .journey-stat strong{font-size:17px}#dashboard .journey-stat small{font-size:9px}#dashboard .hero .hero-motivation{margin-bottom:8px}#section .grid.cols3>.card.summary-balance{min-height:165px}}
@media(prefers-reduced-motion:reduce){#dashboard .hero-side.weight-interactive{transition:none}#dashboard .journey-progress>i{transition:none}}
</style>

<script>
const icon=(name,cl='')=>`<svg class="ico ${cl}"><use href="#${name}"/></svg>`;
const sections={weight:{name:'Weight Tracker',icon:'scale',desc:'Record weigh-ins, understand trends, and celebrate consistency.',fields:[['date','Date','date'],['weight','Weight (kg)','number'],['waist','Waist (cm)','number'],['note','Notes','text']],seed:[{date:'2026-10-06',weight:82.6,waist:91,note:'Morning check-in'},{date:'2026-10-08',weight:82.2,waist:90.8,note:'After morning walk'},{date:'2026-10-10',weight:81.9,waist:90.5,note:'Good progress'},{date:'2026-10-12',weight:81.6,waist:90,note:'Weekly check-in'}]},workout:{name:'Workout Planner',icon:'dumbbell',desc:'Build a comfortable routine with approachable, repeatable sessions.',fields:[['date','Date','date'],['name','Workout','text'],['minutes','Duration (min)','number'],['intensity','Intensity','select','Easy|Moderate|Challenging'],['note','Notes','text']],seed:[{date:'2026-10-12',name:'Full-body beginner circuit',minutes:25,intensity:'Easy',note:'Bodyweight and stretching'},{date:'2026-10-14',name:'Low-impact cardio',minutes:30,intensity:'Moderate',note:'Indoor walk or bike'},{date:'2026-10-16',name:'Strength fundamentals',minutes:25,intensity:'Easy',note:'Focus on form'}]},activity:{name:'Daily Activity',icon:'activity',desc:'Make everyday movement visible and rewarding.',fields:[['date','Date','date'],['name','Activity','text'],['minutes','Minutes','number'],['steps','Steps','number'],['note','Notes','text']],seed:[{date:'2026-10-10',name:'Neighborhood walk',minutes:35,steps:4400,note:'Afternoon movement'},{date:'2026-10-11',name:'Walk and stairs',minutes:42,steps:5300,note:'Evening activity'},{date:'2026-10-12',name:'Morning walk',minutes:38,steps:4900,note:'Felt energetic'}]},meals:{name:'Meal & Nutrition Log',icon:'meal',desc:'Keep a clear record of meals and eating patterns without judgment.',fields:[['date','Date','date'],['name','Meal','text'],['type','Meal type','select','Breakfast|Lunch|Dinner|Snack'],['calories','Calories (estimated)','number'],['note','Notes','text']],seed:[{date:'2026-10-12',name:'Greek yogurt, berries, oats',type:'Breakfast',calories:360,note:'Protein-rich start'},{date:'2026-10-12',name:'Grilled chicken quinoa bowl',type:'Lunch',calories:520,note:'Vegetables and protein'},{date:'2026-10-12',name:'Salmon, rice and vegetables',type:'Dinner',calories:610,note:'Balanced plate'},{date:'2026-10-12',name:'Apple and almonds',type:'Snack',calories:190,note:'Afternoon snack'}]},water:{name:'Hydration Journal',icon:'water',desc:'Log water intake throughout the day and follow your own goal.',fields:[['date','Date','date'],['amount','Amount (ml)','number'],['time','Time','time'],['note','Notes','text']],seed:[{date:'2026-10-12',amount:350,time:'08:15',note:'After waking'},{date:'2026-10-12',amount:500,time:'10:30',note:'Morning'},{date:'2026-10-12',amount:450,time:'13:45',note:'With lunch'},{date:'2026-10-12',amount:400,time:'17:00',note:'Afternoon'}]},habits:{name:'Habit Center',icon:'check',desc:'Track routines that support a sustainable wellness lifestyle.',fields:[['date','Date','date'],['name','Habit','text'],['status','Status','select','Completed|In progress|Skipped'],['note','Notes','text']],seed:[{date:'2026-10-12',name:'Eat vegetables with meals',status:'Completed',note:'Two meals today'},{date:'2026-10-12',name:'Take a daily walk',status:'Completed',note:'Morning walk'},{date:'2026-10-12',name:'Mindful evening routine',status:'In progress',note:'Screens off early'},{date:'2026-10-11',name:'Prepare tomorrow’s lunch',status:'Completed',note:'Planned ahead'}]},sleep:{name:'Sleep & Recovery',icon:'sleep',desc:'Notice how rest and recovery fit into your progress.',fields:[['date','Date','date'],['hours','Hours slept','number'],['quality','Quality','select','Restful|Okay|Restless'],['note','Notes','text']],seed:[{date:'2026-10-10',hours:7.5,quality:'Restful',note:'Good bedtime'},{date:'2026-10-11',hours:7,quality:'Okay',note:'Woke once'},{date:'2026-10-12',hours:8,quality:'Restful',note:'Felt refreshed'}]},goals:{name:'Goals & Milestones',icon:'target',desc:'Set personal milestones and track what matters to you.',fields:[['date','Date','date'],['name','Goal','text'],['target','Target / milestone','text'],['status','Status','select','In progress|Achieved|Paused'],['note','Notes','text']],seed:[{date:'2026-10-12',name:'Build walking consistency',target:'Walk 4 days per week',status:'In progress',note:'Progress feels steady'},{date:'2026-10-12',name:'Hydration rhythm',target:'2000 ml each day',status:'In progress',note:'Use frequent small glasses'},{date:'2026-10-12',name:'Weight milestone',target:'Reach 78 kg',status:'In progress',note:'Gradual approach'}]}};
const storekey='plalinda.bwlt.2026.index.state';let state;try{state=JSON.parse(localStorage.getItem(storekey))}catch(e){}if(!state||!state.records){state={records:Object.fromEntries(Object.entries(sections).map(([k,v])=>[k,v.seed.map((x,i)=>({...x,id:k+'-'+i}))])),settings:{goalWeight:78,startingWeight:84,dailyWater:2000,weeklyMinutes:150},dark:false};}let current='dashboard';let editId=null;const save=()=>{try{localStorage.setItem(storekey,JSON.stringify(state))}catch(e){toast('Storage unavailable: changes may not persist')}};const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const sum=(k,f)=>state.records[k].reduce((a,x)=>a+(Number(x[f])||0),0);const fmt=x=>Number(x).toLocaleString('en-US',{maximumFractionDigits:1});function latestWeight(){return [...state.records.weight].sort((a,b)=>b.date.localeCompare(a.date))[0]?.weight||0}const pct=(n,d)=>Math.min(100,Math.max(0,Math.round(n/(d||1)*100)));const card=(html,cl='')=>`<div class="card ${cl}">${html}</div>`;function navItems(){return[['dashboard','Overview','home'],...Object.entries(sections).map(([k,v])=>[k,v.name,v.icon]),['tools','Free Fitness Tools','tools'],['settings','Settings & Data','settings']]}function renderNav(){document.getElementById('nav').innerHTML=navItems().map(([k,n,i])=>`<button class="navbtn ${current===k?'active':''}" onclick="navigate('${k}')">${icon(i,'small-ico')}${n}</button>`).join('')}
function navigate(k){current=k;renderNav();document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));let id=k==='dashboard'?'dashboard':k==='tools'?'toolsPage':k==='settings'?'settingsPage':'section';document.getElementById(id).classList.add('active');if(k==='dashboard')renderDashboard();else if(k==='tools')renderTools();else if(k==='settings')renderSettings();else renderSection(k);window.scrollTo({top:0,behavior:'smooth'})}
function metric(label,num,unit,detail,ic,shade){return card(`<div class="card-heading"><div class="icon-tile ${shade}">${icon(ic)}</div><span class="tag">LIVE DATA</span></div><div class="metric-num">${fmt(num)} <span class="metric-unit">${unit}</span></div><h3>${label}</h3><p class="micro">${detail}</p>`)}function dashboardRows(k,field,sub){let arr=[...state.records[k]].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);return arr.map(x=>`<div class="list-row"><div class="rowleft"><span class="dot"></span><div><strong>${esc(x[field]||'Entry')}</strong><small>${esc(x.date)} · ${esc(x[sub]||x.note||'Logged')}</small></div></div><button class="btn mini" onclick="navigate('${k}')">View ${icon('arrow','small-ico')}</button></div>`).join('')||'<p class="empty">No entries yet.</p>'}
function renderDashboard(){let w=Number(latestWeight()),goal=Number(state.settings.goalWeight),start=Number(state.settings.startingWeight),lost=Math.max(0,start-w),remaining=Math.max(0,w-goal),wp=pct(start-w,start-goal),water=sum('water','amount'),mins=sum('activity','minutes'),workoutMins=sum('workout','minutes');let weightdata=[...state.records.weight].sort((a,b)=>a.date.localeCompare(b.date));let min=Math.min(...weightdata.map(x=>+x.weight),w)-1;let bars=weightdata.map(x=>`<div class="bar" title="${esc(x.date)} · ${esc(x.weight)} kg" style="height:${Math.max(15,((+x.weight-min)/Math.max(1,start-min))*100)}%"></div>`).join('');document.getElementById('dashboard').innerHTML=`<div class="hero"><div><div class="eyebrow">YOUR PROGRESS, YOUR PACE</div><h1>Build healthy habits.<br>Celebrate every step.</h1><p>One organized place for your weight, movement, meals and daily routines.</p><button class="btn" onclick="openForm('weight')">${icon('plus','small-ico')} Log a weigh-in</button></div><div class="hero-side"><div class="caption">YOUR CURRENT WEIGHT</div><div class="large">${fmt(w)} <span style="font-size:16px">kg</span></div><div class="minis"><div><div class="caption">Goal weight</div><strong>${fmt(goal)} kg</strong></div><div><div class="caption">Remaining</div><strong>${fmt(remaining)} kg</strong></div><div><div class="caption">From start</div><strong>${fmt(lost)} kg</strong></div></div><div class="progress" style="background:#ffffff44"><i style="width:${wp}%;background:#fff"></i></div><div class="caption">${wp}% of your example weight-loss goal</div></div></div><div class="grid cols4">${metric('Current weight',w,'kg','Latest recorded weigh-in','scale','')}${metric('Activity minutes',mins,'min','Total logged activity','activity','mint')}${metric('Workout plans',state.records.workout.length,'sessions','Saved training sessions','dumbbell','blue')}${metric('Hydration logged',water,'ml','Across your water entries','water','lav')}</div><h2 class="section-title">Your wellness at a glance</h2><div class="grid cols3">${card(`<div class="card-heading"><div><h3>Weight progress</h3><p class="micro">All logged weigh-ins</p></div><span class="tag">${weightdata.length} entries</span></div><div class="chart">${bars}</div><div class="chartlab"><span>Earlier</span><span>Recent</span></div><div class="split" style="margin-top:15px"><strong>${fmt(lost)} kg from start</strong><button class="btn mini" onclick="navigate('weight')">Weight history ${icon('arrow','small-ico')}</button></div>`)}${card(`<div class="card-heading"><h3>Daily hydration</h3><span class="icon-tile blue">${icon('water')}</span></div><div class="meter-ring" style="--pct:${pct(water,state.settings.dailyWater)}%"><span>${pct(water,state.settings.dailyWater)}%<small>of target</small></span></div><div class="split"><strong>${fmt(water)} / ${fmt(state.settings.dailyWater)} ml</strong><button class="btn mini" onclick="openForm('water')">Log water</button></div>`)}${card(`<div class="card-heading"><h3>Movement & consistency</h3><span class="icon-tile mint">${icon('activity')}</span></div><div class="metric-num">${fmt(mins+workoutMins)} <span class="metric-unit">total min</span></div><p class="micro">Activity and planned workout minutes</p><div class="progress"><i style="width:${pct(mins+workoutMins,state.settings.weeklyMinutes)}%"></i></div><div class="split"><span class="micro">Example weekly target: ${state.settings.weeklyMinutes} min</span><button class="btn mini" onclick="navigate('activity')">Details</button></div><div class="list-row"><strong>Habits completed</strong><b>${state.records.habits.filter(x=>x.status==='Completed').length}</b></div><div class="list-row"><strong>Meal entries</strong><b>${state.records.meals.length}</b></div>` )}</div><h2 class="section-title">Recent entries & next steps</h2><div class="grid cols2">${card(`<div class="card-heading"><h3>Recent meals</h3><button class="btn mini" onclick="navigate('meals')">See all</button></div>${dashboardRows('meals','name','type')}`)}${card(`<div class="card-heading"><h3>Your activity timeline</h3><button class="btn mini" onclick="navigate('activity')">See all</button></div>${dashboardRows('activity','name','minutes')}`)}</div><h2 class="section-title">Jump into your workspace</h2><div class="grid cols4">${[['weight','Log a weigh-in','Save weight and measurements'],['workout','Plan a workout','Prepare your next session'],['meals','Log a meal','Capture nutrition details'],['habits','Review habits','Keep routines on track']].map(([k,title,detail])=>`<button class="shortcut" onclick="navigate('${k}')"><span class="icon-tile">${icon(sections[k].icon)}</span><span><strong>${title}</strong><small>${detail}</small></span>${icon('arrow','arr')}</button>`).join('')}</div>`}
function renderSection(k){if(!sections[k])return;let cfg=sections[k],arr=[...state.records[k]].sort((a,b)=>String(b.date).localeCompare(String(a.date)));let summary=k==='weight'?`${fmt(latestWeight())} kg · latest weight`:k==='water'?`${fmt(sum(k,'amount'))} ml · logged water`:k==='activity'?`${fmt(sum(k,'minutes'))} min · logged activity`:k==='workout'?`${fmt(sum(k,'minutes'))} min · planned sessions`:k==='meals'?`${fmt(sum(k,'calories'))} kcal · total logged estimate`:k==='sleep'?`${fmt(arr.reduce((a,x)=>a+(+x.hours||0),0)/(arr.length||1))} hours · average sleep`:k==='habits'?`${arr.filter(x=>x.status==='Completed').length} completed habits`:`${arr.filter(x=>x.status==='Achieved').length} achieved milestones`;let cols=cfg.fields.filter(f=>f[0]!=='note');document.getElementById('section').innerHTML=`<div class="page-head"><div><div class="eyebrow">MY WELLNESS WORKSPACE</div><h1>${cfg.name}</h1><p>${cfg.desc}</p></div><button class="btn primary" onclick="openForm('${k}')">${icon('plus','small-ico')} Add ${k==='weight'?'weigh-in':'entry'}</button></div><div class="detail-banner"><div><span>TRACKING SNAPSHOT</span><strong>${summary}</strong><span>${arr.length} entries saved · editable anytime</span></div><div class="icon-tile" style="height:58px;width:58px;border-radius:20px">${icon(cfg.icon)}</div></div><div class="grid cols3" style="margin-bottom:19px">${card(`<div class="card-heading"><h3>Total entries</h3><span class="icon-tile">${icon(cfg.icon)}</span></div><div class="metric-num">${arr.length}</div><p class="micro">Items in your ${cfg.name.toLowerCase()}</p>`)}${card(`<div class="card-heading"><h3>Latest activity</h3><span class="tag">UPDATED</span></div><div class="metric-num" style="font-size:23px">${arr.length?esc(arr[0].date):'—'}</div><p class="micro">Date of most recent entry</p>`)}${card(`<div class="card-heading"><h3>Your next step</h3><span class="icon-tile mint">${icon('target')}</span></div><p style="margin:12px 0">Keep your records fresh to see meani function initMarketingDemo(){

      if(!Array.isArray(state.records[k]))state.records[k]=[];

// Build search index with exact record location and field, not just sections.
let searchEntries=[];
function buildSearchIndex(){const out=[];for(const [k,title,ic] of navItems())out.push({k,title,ic,kind:'section',excerpt:k==='dashboard'?'Personal progress dashboard':k==='help'?'Instructions and installation guide':title});for(const [k,cfg] of Object.entries(sections)){for(const row of state.records[k])for(const [field,label] of cfg.fields){const v=row[field];if(v===null||v===undefined||v==='')continue;out.push({k,kind:'record',ic:cfg.icon,title:cfg.name+' · '+label,excerpt:String(v),field,recordId:row.id});}}for(const [i,info] of (window.helpTopics||[]).entries())out.push({k:'help',kind:'guide',ic:'tools',title:info[0],excerpt:info[1],guideId:i});for(const term of ['BMI Calculator','Walking Time Planner','Hydration Quick Log','Goal Progress Calculator'])out.push({k:'tools',kind:'tool',ic:'tools',title:term,excerpt:'Open fitness calculator'});return out;}
function markMatches(value,query){const v=String(value||'');const q=String(query||'');if(!q)return esc(v);let from=0,found,i,html='';const lower=v.toLowerCase(),needle=q.toLowerCase();while((i=lower.indexOf(needle,from))!==-1){html+=esc(v.slice(from,i))+'<mark>'+esc(v.slice(i,i+needle.length))+'</mark>';from=i+needle.length;if(html.length>20000)break;}return html+esc(v.slice(from));}
updateSearch=function(query){const q=query.trim().toLowerCase();const el=document.getElementById('searchResults');if(!el)return;const data=buildSearchIndex();let filtered=q?data.filter(x=>(x.title+' '+x.excerpt).toLowerCase().includes(q)):data.filter(x=>x.kind==='section');filtered=filtered.slice(0,65);searchEntries=filtered.map(x=>({...x,q}));el.innerHTML=filtered.map((item,i)=>`<button type="button" class="search-hit" data-search-index="${i}">${icon(item.ic)}<span><strong>${markMatches(item.title,q)}</strong><small class="search-excerpt">${markMatches(item.excerpt.slice(0,170),q)}</small></span>${icon('arrow','small-ico')}</button>`).join('')||'<p class="empty">No matches found. Try another term.</p>';
 el.querySelectorAll('[data-search-index]').forEach(btn=>btn.addEventListener('click',()=>selectSearchHit(searchEntries[Number(btn.dataset.searchIndex)])));
};
function selectSearchHit(hit){if(!hit)return;closeModal();navigate(hit.k);if(hit.kind==='guide'){let item=document.querySelector(`.guideitem[data-guide="${hit.guideId}"]`);if(item)item.open=true;}
 setTimeout(()=>{let target=null;if(hit.kind==='record'){target=[...document.querySelectorAll('#section .records tbody tr')].find(x=>x.dataset.recordId===hit.recordId);}
 else if(hit.kind==='guide')target=document.querySelector(`.guideitem[data-guide="${hit.guideId}"]`);
 else if(hit.kind==='tool'){target=[...document.querySelectorAll('#toolsPage .card')].find(c=>c.textContent.includes(hit.title));}
 else target=document.querySelector('.page.active h1');
 if(!target)return;const highlighted=highlightRealText(target,hit.q);target.classList.add('search-flash');if(hit.kind==='record')target.classList.add('search-target');target.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>target.classList.remove('search-flash'),3000);},180);
}
function highlightRealText(root,query){if(!query)return false;let found=false;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode()){const n=walker.currentNode;if(n.parentElement?.closest('button,mark,script,style'))continue;if(n.textContent.toLowerCase().includes(query.toLowerCase()))nodes.push(n);}
 nodes.slice(0,25).forEach(n=>{const v=n.textContent,frag=document.createDocumentFragment(),low=v.toLowerCase(),q=query.toLowerCase();let pos=0,idx;while((idx=low.indexOf(q,pos))>=0){if(idx>pos)frag.append(document.createTextNode(v.slice(pos,idx)));const m=document.createElement('mark');m.textContent=v.slice(idx,idx+q.length);frag.append(m);pos=idx+q.length;}if(pos<v.length)frag.append(document.createTextNode(v.slice(pos)));n.replaceWith(frag);found=true;});return found;}
// Calculator validations and daily-only hydration results.
calcGoal=function(){const st=Number(document.getElementById('goalstart').value),g=Number(document.getElementById('goalend').value),w=Number(latestWeight());document.getElementById('goalout').textContent=st>g&&g>=20&&st<=400&&w>0?pct(st-w,st-g)+'% achieved':'Enter valid weight-loss goal values and record a weigh-in';};
quickWater=function(){let field=document.getElementById('quickwater'),ml=Number(field.value);if(!Number.isFinite(ml)||ml<=0||ml>5000)return toast('Enter water from 1 to 5000 ml');state.records.water.push({id:'qw-'+Date.now()+'-'+Math.floor(Math.random()*100000),date:todayLocal(),amount:ml,time:new Date().toTimeString().slice(0,5),note:'Quick hydration log'});save();document.getElementById('waterout').textContent=fmt(total(entriesOnDay('water'),'amount'))+' ml today';toast('Water entry saved to your journal');};
const originalTools=renderTools;renderTools=function(){originalTools();const out=document.getElementById('waterout');if(out)out.textContent=fmt(total(entriesOnDay('water'),'amount'))+' ml today';document.querySelectorAll('#toolsPage .toolpad>.btn').forEach(button=>button.classList.add('tool-cta'));};

/* V5 refinements: connected, non-destructive enhancements to the existing Marketing V4. */
const v5BaseDashboard = renderDashboard;
renderDashboard = function(){
  v5BaseDashboard();
  const hero=document.querySelector('#dashboard .hero');
  if(!hero)return;
  // Preserve the original V4 welcome layout: one compact water action added above the weigh-in button.
  const left=hero.firstElementChild;
  const weighIn=left.querySelector('.hero-cta');
  if(weighIn){
    const actions=document.createElement('div');
    actions.className='hero-actions-vertical';
    const waterButton=document.createElement('button');
    waterButton.type='button';
    waterButton.className='btn hero-cta hero-water-cta';
    waterButton.setAttribute('aria-label','Log Water');
    waterButton.innerHTML=icon('water','small-ico')+' Log Water';
    waterButton.addEventListener('click',()=>openForm('water'));
    weighIn.before(actions);
    actions.append(waterButton,weighIn);
  }

  const weightCard=hero.querySelector('.hero-side');
  if(weightCard){
    weightCard.classList.add('weight-interactive');
    weightCard.tabIndex=0;
    weightCard.setAttribute('role','button');
    weightCard.setAttribute('aria-label','View your weight tracker');
    // Keep the original compact weight-panel appearance while preserving its click interaction.
    weightCard.addEventListener('pointerdown',()=>weightCard.classList.add('weight-touch'));
    weightCard.addEventListener('pointerup',()=>setTimeout(()=>weightCard.classList.remove('weight-touch'),120));
    weightCard.addEventListener('pointercancel',()=>weightCard.classList.remove('weight-touch'));
    weightCard.addEventListener('pointerleave',()=>weightCard.classList.remove('weight-touch'));
    weightCard.addEventListener('click',()=>{weightCard.classList.add('weight-touch');setTimeout(()=>navigate('weight'),145);});
    weightCard.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();navigate('weight')}});
  }

  const ring=document.querySelector('#dashboard .hydration-card .meter-ring > span');
  if(ring){const value=ring.firstChild?.textContent?.trim()||'0%';ring.innerHTML=`<strong class="water-percent">${esc(value)}</strong><small class="water-subtitle">of target</small>`;}
};
const v5BaseSection=renderSection;
renderSection=function(k){
  v5BaseSection(k);
  const summaries=document.querySelectorAll('#section>.grid.cols3>.card');
  summaries.forEach((card,i)=>{
    if(i<3)card.classList.add('summary-red-outline');
    if(i<2){card.classList.add('summary-balance');if(i===1)card.classList.add('summary-recent');}
  });
};
const v5BaseHelp=renderHelp;
renderHelp=function(){
  v5BaseHelp();
  const input=document.getElementById('guideQuery');
  const list=document.getElementById('guideList');
  if(!input||!list)return;
  list.querySelectorAll('.guideitem').forEach(item=>item.open=false);
  input.insertAdjacentHTML('afterend','<div id="guideFindStatus" class="guide-find-status" aria-live="polite">Choose a topic to read the instructions.</div>');
  filterGuide('');
};
function v5MarkedText(text,q){
  const v=String(text??'');
  if(!q)return esc(v);
  const low=v.toLowerCase(),needle=q.toLowerCase();
  let out='',pos=0,index;
  while((index=low.indexOf(needle,pos))>=0){out+=esc(v.slice(pos,index))+'<mark>'+esc(v.slice(index,index+needle.length))+'</mark>';pos=index+needle.length;}
  return out+esc(v.slice(pos));
}
filterGuide=function(query){
  const q=String(query??'').trim().toLocaleLowerCase();
  const items=[...document.querySelectorAll('#guideList .guideitem')];
  let matches=0;
  for(const item of items){
    const index=Number(item.dataset.guide);
    const [title,description]=(window.helpTopics||[])[index]||['',''];
    const inTitle=title.toLocaleLowerCase().includes(q), inBody=description.toLocaleLowerCase().includes(q);
    const matchesThis=!q||inTitle||inBody;
    item.hidden=!matchesThis;
    // Searching never opens a guide entry. Only explicitly clicking its header can.
    item.open=false;
    const summary=item.querySelector('summary');
    if(summary){
      let snippet='';
      if(q&&!inTitle&&inBody){
        const idx=description.toLowerCase().indexOf(q);
        const lo=Math.max(0,idx-48),hi=Math.min(description.length,idx+q.length+64);
        snippet=`<span class="guide-match-excerpt">${lo?'…':''}${v5MarkedText(description.slice(lo,hi),q)}${hi<description.length?'…':''}</span>`;
      }
      summary.innerHTML=`<span class="guide-summary-main"><span>${v5MarkedText(title,q)}</span>${snippet}</span>`;
    }
    if(matchesThis)matches++;
  }
  const status=document.getElementById('guideFindStatus');
  if(status)status.textContent=q?(matches?`${matches} matching topic${matches===1?'':'s'} — select one to open.`:'No matching topics. Try a different word.'):'Choose a topic to read the instructions.';
};

// V7: splash always; profile once per browser storage, including the seeded marketing preview.
const v7ProfileKey='plalinda.bwlt.2026.index.onboarded';
const previousV7Finish=finishOnboarding;
finishOnboarding=function(e){previousV7Finish(e);if(state.profileReady&&state.settings.name&& !document.getElementById('welcome').classList.contains('show')){try{localStorage.setItem(v7ProfileKey,'yes')}catch(err){}}};
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')closeModal()});
document.body.classList.toggle('dark',!!state.dark);renderNav();navigate('dashboard');syncThemeIcon();
setTimeout(()=>{const splash=document.getElementById('plalindaSplash');splash.classList.add('splash-off');setTimeout(()=>splash.remove(),300);let done=false;try{done=localStorage.getItem(v7ProfileKey)==='yes'}catch(e){}if(!done||!state.profileReady||!state.settings.name)onboarding();},850);


/* Isolated customer account, 10 purchased codes; never uses Rental/Family keys. */
const BWLT_EDITION='index';
const BWLT_CODES=["BWLT-8N4K-6P2Q", "BWLT-6V9J-3M7H", "BWLT-2Q8P-5L4Y", "BWLT-7C3T-9K6N", "BWLT-4G8R-2S5W", "BWLT-9Z6D-3F7A", "BWLT-5M2X-8J4E", "BWLT-3Y7N-6V9C", "BWLT-8H5P-4T2R", "BWLT-6L3W-7Q9B"];
const BWLT_FREE=BWLT_EDITION==='index',BWLT_MARKETING=BWLT_EDITION==='marketing';
const BWLT_ACCESS='plalinda.bwlt.2026.index.activated';
const BWLT_CREDITS='plalinda.bwlt.2026.index.credits';
let bwltActivated=BWLT_EDITION!=='index',bwltCredits=5;
try{if(BWLT_FREE){bwltActivated=localStorage.getItem(BWLT_ACCESS)==='yes';const v=localStorage.getItem(BWLT_CREDITS);if(v!==null&&Number.isFinite(Number(v)))bwltCredits=Math.max(0,Math.min(5,Number(v)));}}catch(e){}
function bwltRedrawBanner(){const b=document.getElementById('bwltCreditBanner');if(!b)return;b.hidden=!BWLT_FREE||bwltActivated;const n=b.querySelector('[data-credits]');if(n)n.textContent=bwltCredits;}
function bwltActivate(code){if(!BWLT_CODES.includes(String(code||'').trim().toUpperCase())){toast('Invalid code. Please check your Welcome guide.');return false;}bwltActivated=true;try{localStorage.setItem(BWLT_ACCESS,'yes')}catch(e){}bwltRedrawBanner();closeModal();if(current==='settings')renderSettings();if(current==='tools')renderTools();toast('Full Version Activated — Lifetime Access');return true;}
function bwltOpenActivation(){if(bwltActivated)return navigate('settings');document.getElementById('modalTitle').textContent='Activate your Lifetime Full Version';document.getElementById('modalBody').innerHTML=`<form class="bwlt-activation" onsubmit="event.preventDefault();bwltActivate(this.elements.activation.value)"><p>Enter the activation code from your Plalinda Studio Welcome PDF to unlock unlimited tracking and Free Fitness Tools.</p><input name="activation" placeholder="Enter your activation code" aria-label="Activation code" autocomplete="off" spellcheck="false" required><button class="btn primary full" type="submit">Activate Full Version</button></form>`;document.getElementById('modal').classList.add('open');}
function bwltUseCredit(){if(!BWLT_FREE||bwltActivated)return true;if(bwltCredits<=0){bwltOpenActivation();return false;}bwltCredits--;try{localStorage.setItem(BWLT_CREDITS,String(bwltCredits))}catch(e){}bwltRedrawBanner();return true;}
const bwltPriorSave=submitRecord;
submitRecord=function(e,k){if(BWLT_FREE&&!bwltActivated){if(!e.target.checkValidity())return; e.preventDefault();if(!bwltUseCredit())return;}return bwltPriorSave(e,k);};
const bwltPriorDelete=deleteRecord;
deleteRecord=function(k,id){if(!BWLT_FREE||bwltActivated)return bwltPriorDelete(k,id);if(!state.records[k]?.some(row=>row.id===id))return; if(bwltCredits<=0)return bwltOpenActivation();confirmInApp({title:'Delete this entry?',message:'Deleting this record will use one trial credit and cannot be undone.',confirmLabel:'Delete Entry',danger:true,onConfirm:()=>{if(!bwltUseCredit())return;state.records[k]=state.records[k].filter(row=>row.id!==id);save();navigate(k);toast('Entry deleted')}});};
const bwltPriorSettings=renderSettings;
renderSettings=function(){bwltPriorSettings();if(current==='help')return;const grid=document.querySelector('#settingsPage .settings-tiles')||document.querySelector('#settingsPage .grid.cols2');if(!grid)return;let tiles=[...grid.querySelectorAll(':scope > .card')];let backup=tiles.find(x=>x.textContent.includes('Backup & Restore'))||tiles[1];if(!backup)return;backup.querySelectorAll('.activation-strip,.activation-status').forEach(e=>e.remove());let area=document.createElement('div');area.className='edition-strip'+(bwltActivated?' activated':'');area.setAttribute('role',bwltActivated?'status':'button');area.innerHTML=bwltActivated?'<strong>✓ Full Version Activated — Lifetime Access</strong><p>Unlimited use. All tracking and Fitness Tools unlocked. No subscription or further purchase required.</p>':`<strong>Free Demo — ${bwltCredits} Credits Remaining</strong><p>Tap here to enter your purchased code and unlock lifetime full access.</p>`;if(!bwltActivated){area.tabIndex=0;area.onclick=bwltOpenActivation;area.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();bwltOpenActivation()}}}backup.insertBefore(area,backup.children[1]||null);grid.querySelectorAll(':scope > .activation-status').forEach(e=>e.remove());};
const bwltPriorTools=renderTools;
renderTools=function(){if(BWLT_FREE&&!bwltActivated){document.getElementById('toolsPage').innerHTML=`<div class="page-head"><div><h1>Free Fitness Tools</h1><p>Bonus tools included with Lifetime Full Version.</p></div></div><div class="card" style="padding:35px;text-align:center"><div style="font-size:35px">🔒</div><h2>Unlock Free Fitness Tools</h2><p>Activate your purchased copy to use the BMI, walking and hydration tools.</p><button class="btn primary" onclick="bwltOpenActivation()">Enter Activation Code</button></div>`;return;}bwltPriorTools();document.querySelectorAll('#toolsPage input[type="number"]').forEach(el=>{el.value='';el.placeholder=el.id==='bmiw'?'Enter weight in kg':el.id==='bmih'?'Enter height in cm':el.id==='walkdays'?'Days per week':el.id==='walkmin'?'Minutes per day':el.id==='quickwater'?'Enter water in ml':'Enter your value';});};
const bwltPriorNavigate=navigate;
let bwltSkipHistory=false;
try{history.replaceState({bwltPage:'dashboard'},'',location.href)}catch(e){}
navigate=function(k){if(BWLT_FREE&&!bwltActivated&&k==='tools'){current=k;renderNav();document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('toolsPage').classList.add('active');renderTools();}else bwltPriorNavigate(k);if(!bwltSkipHistory){try{history.pushState({bwltPage:k},'',location.href)}catch(e){}}};
window.addEventListener('popstate',e=>{bwltSkipHistory=true;try{bwltPriorNavigate(e.state?.bwltPage||'dashboard');if(current==='tools')renderTools()}finally{bwltSkipHistory=false;}});
const bwltPriorOnboarding=onboarding;
onboarding=function(){bwltPriorOnboarding();document.querySelectorAll('#welcome input').forEach(input=>{input.value='';if(input.name==='name')input.placeholder='Enter your name';else if(input.name==='height')input.placeholder='Your height in cm';else if(input.name==='startingWeight')input.placeholder='Your starting weight in kg';else if(input.name==='goalWeight')input.placeholder='Your goal weight in kg';});};
const bwltPriorFinish=finishOnboarding;
finishOnboarding=function(e){bwltPriorFinish(e);bwltRedrawBanner();};
const bwltCreditBanner=document.getElementById('bwltCreditBanner');if(bwltCreditBanner)bwltCreditBanner.addEventListener('click',bwltOpenActivation);
const bwltInstall=document.getElementById('bwltInstall');let bwltInstallEvent=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();bwltInstallEvent=e;bwltInstall?.classList.add('available')});
bwltInstall?.addEventListener('click',async()=>{if(!bwltInstallEvent)return;await bwltInstallEvent.prompt();bwltInstallEvent=null;bwltInstall.classList.remove('available')});
window.addEventListener('appinstalled',()=>{bwltInstallEvent=null;bwltInstall?.classList.remove('available')});
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
bwltRedrawBanner();
